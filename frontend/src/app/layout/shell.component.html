<div class="shell">
  <header class="shell-header">
    <div class="brand">Tribastion Site USV</div>
    <div class="identity">
      @if (currentUser(); as user) {
        <span class="display-name">{{ user.display_name || user.username }}</span>
        <span class="role">{{ user.role }}</span>
      }
      <button type="button" class="logout" (click)="logout()">Log out</button>
    </div>
  </header>

  <div class="shell-body">
    <nav class="shell-nav">
      <a routerLink="/dashboard" routerLinkActive="active">Dashboard</a>
      <a routerLink="/site" routerLinkActive="active">Site</a>
      <a routerLink="/usv" routerLinkActive="active">USV</a>
      <a routerLink="/integrations" routerLinkActive="active">Integrations</a>
      @if (isPlatformAdmin) {
        <a routerLink="/users" routerLinkActive="active">Users</a>
      }
    </nav>

    <main class="shell-content">
      <router-outlet></router-outlet>
    </main>
  </div>
</div>
